[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qbridge"
version = "0.1.0"
description = "Find out why a real-time task on QNX 8.0 missed its deadline, test a fix and measure it: MCP server and CLI, native .kev trace decoder, human-approved experiments."
keywords = ["qnx", "rtos", "real-time", "mcp", "kernel-trace", "priority-inversion"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Debuggers",
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://vychopade.github.io/qbridge/"
Source = "https://github.com/vychopade/qbridge"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
qbridge = "qbridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
