# Runs without a QNX target and without the QNX SDP: the unit tests, `qbridge
# replay` (reruns the analysis on data recorded on the reference target and fails
# if any result differs from what qbridge reported there), the native .kev decoder
# against saved traceprinter output, and the raw-trace workflow.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - name: Replay recorded results (no target)
        run: qbridge replay
      - name: Native .kev decoder vs traceprinter output (no SDP)
        shell: bash
        run: qbridge validate-kev tests/fixtures/kev/*.kev.gz --out kev-validation.json
      - name: Analyse a raw kernel trace (no target, no SDP)
        shell: bash
        run: qbridge trace --file tests/fixtures/kev/inversion_fault.kev.gz --process rtdemo --perfetto > trace.json && grep -q confirmed_priority_inversion trace.json
